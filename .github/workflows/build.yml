name: Build Forge Mod JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Gradle Wrapper & Build
        run: |
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew
          ./gradlew build
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MakeItWarmer-Mod-JAR
          path: build/libs/*.jar
